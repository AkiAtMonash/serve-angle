<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>実機チェック</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --mut:#999; --ok:#5d5; --ng:#f66; --acc:#4af; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--mut); margin:0 0 12px; }
  button { font:inherit; font-size:17px; padding:12px 18px; border:0; border-radius:10px; background:var(--acc); color:#000; width:100%; margin:6px 0; }
  button:disabled { opacity:.4; }
  video { width:100%; max-height:40vh; background:#000; border-radius:10px; margin:8px 0; }
  pre { white-space:pre-wrap; word-break:break-all; background:#1c1c1c; padding:12px; border-radius:10px; font-size:13px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
</style>
</head>
<body>
<h1>実機チェック</h1>
<p>背面カメラのfps、録画できる形式、骨格推定の速さを測るのだ。1分くらいかかるのだ。終わったら「結果をコピー」を押して、そのまま貼り付けて送ってほしいのだ。</p>
<button id="start">チェックを始める</button>
<video id="v" playsinline muted></video>
<pre id="log">まだ始めていないのだ。</pre>
<button id="copy" disabled>結果をコピー</button>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1";
const MODEL = n => `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${n}/float16/latest/pose_landmarker_${n}.task`;
const out = {};
const logEl = document.getElementById("log"), v = document.getElementById("v");
const log = () => { logEl.textContent = JSON.stringify(out, null, 2); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// camera fps actually delivered, counted with requestVideoFrameCallback
function measureCameraFps(sec) {
  return new Promise(res => {
    if (!v.requestVideoFrameCallback) return res(null);
    let n = 0, t0 = null;
    const cb = (now, meta) => {
      if (t0 === null) t0 = meta.mediaTime;
      n++;
      if (meta.mediaTime - t0 >= sec) return res(+(n / (meta.mediaTime - t0)).toFixed(1));
      v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
  });
}

async function poseFps(vision, PoseLandmarker, model, delegate, sec) {
  const t = performance.now();
  let lm;
  try {
    lm = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL(model), delegate }, runningMode: "VIDEO", numPoses: 1,
    });
  } catch (e) { return { error: String(e) }; }
  const loadMs = Math.round(performance.now() - t);
  let n = 0, found = 0, last = -1;
  const t0 = performance.now();
  while (performance.now() - t0 < sec * 1000) {
    const ts = performance.now();
    if (v.currentTime !== last) {
      last = v.currentTime;
      lm.detectForVideo(v, ts, r => { n++; if (r.landmarks.length) found++; });
    }
    await new Promise(r => requestAnimationFrame(r));
  }
  lm.close();
  return { fps: +(n / sec).toFixed(1), personFoundRate: n ? +(found / n).toFixed(2) : 0, loadMs };
}

async function recordTest(stream, mime) {
  const rec = new MediaRecorder(stream, { mimeType: mime });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => (rec.onstop = r));
  rec.start(); await sleep(2000); rec.stop(); await done;
  const blob = new Blob(chunks, { type: mime });
  return { bytes: blob.size, type: blob.type };
}

document.getElementById("start").onclick = async e => {
  e.target.disabled = true;
  out.userAgent = navigator.userAgent;
  log();
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
    });
  } catch (err) { out.cameraError = String(err); log(); return; }
  const track = stream.getVideoTracks()[0];
  out.camera = { label: track.label, capabilities: track.getCapabilities?.() ?? null, settings: track.getSettings() };
  v.srcObject = stream; await v.play();
  out.cameraFpsMeasured = await measureCameraFps(3); log();

  const types = ["video/mp4", "video/mp4;codecs=avc1", "video/mp4;codecs=avc1.42E01E", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  out.recorderSupported = Object.fromEntries(types.map(t => [t, MediaRecorder.isTypeSupported(t)]));
  const best = types.find(t => MediaRecorder.isTypeSupported(t));
  try { out.recordTest = best ? { mime: best, ...(await recordTest(stream, best)) } : null; }
  catch (err) { out.recordTest = { error: String(err) }; }
  log();

  try {
    const { FilesetResolver, PoseLandmarker } = await import(`${MP}/vision_bundle.mjs`);
    const vision = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    out.pose = {};
    for (const [model, delegate] of [["lite", "GPU"], ["full", "GPU"], ["lite", "CPU"]]) {
      out.pose[`${model}_${delegate}`] = "測定中…"; log();
      out.pose[`${model}_${delegate}`] = await poseFps(vision, PoseLandmarker, model, delegate, 6);
      log();
    }
  } catch (err) { out.poseError = String(err); }
  out.done = true; log();
  track.stop();
  document.getElementById("copy").disabled = false;
};

document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(logEl.textContent); document.getElementById("copy").textContent = "コピーしたのだ"; }
  catch { document.getElementById("copy").textContent = "コピーできなかったので、上の文字を長押しで選んでほしいのだ"; }
};
</script>
</body>
</html>
